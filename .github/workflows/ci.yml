name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Verify import/export resolution
        run: node scripts/verify-imports.mjs

      - name: Build
        run: bun run build
        env:
          # Vite bakes these into the static bundle at build time. Placeholder
          # values are enough to prove the build succeeds — nothing here talks
          # to a real backend or Supabase project during a build.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_API_BASE_URL: http://localhost:4000

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B package

  ml-service:
    name: ML Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [frontend, backend, ml-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t hr-intel-backend:ci ./backend

      - name: Build ml-service image
        run: docker build -t hr-intel-ml-service:ci ./ml-service

      - name: Build frontend image
        run: |
          docker build -t hr-intel-frontend:ci ./frontend \
            --build-arg VITE_SUPABASE_URL=https://placeholder.supabase.co \
            --build-arg VITE_SUPABASE_ANON_KEY=placeholder-anon-key \
            --build-arg VITE_API_BASE_URL=http://localhost:4000
